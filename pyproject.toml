[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soundtrack_classifier"
version = "0.1.0"
description = "An End-to-End ML Pipeline for Soundtrack Annotation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "scipy>=1.10.1",
    "ffmpeg-python>=0.2.0",
    "nnAudio>=0.3.1",
    "demucs>=4.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "timm>=0.9.2",
    "einops>=0.6.1",
    "numpy>=1.24.3",
    "pandas>=2.0.2",
    "lightning>=2.0.3",
    "wandb>=0.15.4",
    "hydra-core>=1.3.2",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.3.2"
]

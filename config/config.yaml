# Global configuration for soundtrack classifier
train_labels:
  - erhu
  - pipa
  - dizi
  - percussion
  - strings_western
  - sheng
  - suona
  - guzheng
  - yangqin
  - woodwind
  - brass
  - nonmusic

# CNN Baseline Configuration
cnn:
  audio:
    sample_rate: 44100
    duration_sec: 4.0
    # CQT specific parameters
    cqt:
      fmin: 65.4
      fmax: null
      n_bins: 84
      bins_per_octave: 12

  training:
    batch_size: 16
    epochs: 50
    learning_rate: 0.0001
    num_workers: 4
    early_stopping_patience: 10

  augmentation:
    spec_augment: true
    minority_only: true

  degradation:
    enabled: true
    probability: 0.4  # 40% chance to degrade an audio clip during training
    sample_rate: 44100

  paths:
    data_dir: "data/train"
    models_dir: "models"

# Archival CRNN Pipeline Configuration
crnn:
  audio:
    sample_rate: 22050
    crop_duration_sec: 8.0
    window_sec: 10.0
    hop_sec: 2.5
    cqt:
      fmin: 65.4
      n_bins: 168
      bins_per_octave: 24
      hop_length: 512
      in_channels: 2

  degradation:
    enabled: true
    probability: 40            # 40% of crops get degraded
    lowpass_cutoff_hz: 5500.0
    lowpass_order: 2
    highpass_cutoff_hz: 80.0
    highpass_order: 1
    snr_min_db: 42.0           # Subtle ambient film bed (10 dB quieter than previous baseline)
    snr_max_db: 52.0           # Clean archival transfer baseline
    hum_frequency_hz: 50.0
    hum_level: 0.005           # Dropped to 0.5% (faint analog warmth)
    crackle_probability: 0.0   # Disabled harsh dust clicks/pops
    saturation_drive: 1.03     # Subtle optical print compression without volume boost
    reverb_room_size: 0.15
    reverb_wet_level: 0.03

  inference:
    batch_size: 32
    rms_threshold: 0.008
    confidence_threshold: 0.35
    min_event_sec: 0.4
    include_nonmusic: true

  training:
    batch_size: 16
    epochs: 50
    learning_rate: 0.0003
    early_stopping_patience: 7
    num_workers: 4
    precompute_features: true  # Default: true. Precomputes & caches CQT+HPSS tensors for 5-10x faster training. If false, loads dynamically.
    features_dir: "data/features_cqt_hpss"
    focal_gamma: 2.0
    focal_alpha: 0.25

  model:
    hidden_size: 128
    num_rnn_layers: 2
    bidirectional: true
    dropout: 0.2

# Common paths
paths:
  data_dir: "data/train"
  models_dir: "models"

# ==============================================================================
# Audio Spectrogram Transformer (AST) / Foundation Model Probing Pipeline
# ==============================================================================
ast:
  standardization:
    sr_mert: 24000
    sr_clap: 48000
    pre_roll_sec: 0.05
    post_roll_sec: 2.0
    silence_top_db: 40.0

  segment_augment:
    window_sec: 4.0
    hop_sec: 2.0
    mixup_prob: 0.5
    mixup_alpha: 0.5
    bandpass_low_hz: 80.0
    bandpass_high_hz: 7500.0
    bandpass_order: 2
    hum_frequency_hz: 50.0
    hum_level: 0.005

  feature_extraction:
    mert_model_id: "m-a-p/MERT-v1-95M"
    clap_model_id: "laion/clap-htsat-unfused"
    mert_dim: 768
    clap_dim: 512
    fused_dim: 1280
    device: "mps"
    fp16: true
    batch_size: 16

  probing_head:
    in_dim: 1280
    hidden_dims:
      - 512
      - 256
    # TODO: update if more classes are added
    num_classes: 12
    dropouts:
      - 0.4
      - 0.3
    lr: 0.001
    weight_decay: 0.01
    epochs: 40
    batch_size: 64
    early_stopping_patience: 10
    n_splits: 5

  separation:
    # Set 'enabled: false' to disable HTDemucs stem separation (Phase 5) and run inference directly on composite audio.
    # Set 'enabled: true' to isolate dialogue (a_DX) and Foley (a_FX) from soundtrack music (a_MX) before scoring.
    enabled: false
    model_name: "htdemucs"
    film_audio_path: "data/test/come-drink-with-me/Come Drink With Me.wav"
    output_dir: "data/stems"
    music_stem: "other"

  scoring:
    window_sec: 4.0
    hop_sec: 1.0
    batch_size: 32
    rms_threshold: 0.020

  postprocessing:
    p_high: 0.80
    p_low: 0.45
    median_filter_sec: 2.0
    min_duration_sec: 1.5
    entropy_rejection_enabled: true
    max_normalized_entropy: 0.80
    min_confidence_gate: 0.40

  paths:
    data_dir: "data/train"
    standardized_dir: "data/ast/standardized"
    segments_dir: "data/ast/augmented_segments"
    features_dir: "data/ast/features"
    model_checkpoint: "models/ast_probing_head.pt"
    film_audio_path: "data/test/come-drink-with-me/Come Drink With Me.wav"
    probabilities_path: "reports/ast_probing_raw_probabilities.npy"
    annotation_json: "reports/ast_inference_eval_come_drink_with_me.json"
    annotation_csv: "reports/ast_inference_eval_come_drink_with_me.csv"
    cuesheet: "data/test/come-drink-with-me/Film Music Cue Sheet for Come Drink with Me (English) - English Version.csv"
    mapping: "data/test/come-drink-with-me/instrument_mapping.json"